    <text x="48" y="338" fill="#B7C3D9" font-size="23">A workspace for the way you think.</text>
    <text x="48" y="445" fill="#B7C3D9" font-size="17">LOCAL SOURCE. ROOM TO CHANGE.</text>
    <text x="1154" y="445" text-anchor="end" fill="#AD98F5" font-size="17">FOUNDATION46 / FIELD NOTES 01</text>
  </g>
  <g transform="translate(628 66)">
