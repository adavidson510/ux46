    <linearGradient id="pane" x2="1" y2="1"><stop stop-color="#25213F"/><stop offset="1" stop-color="#131D2C"/></linearGradient>
  </defs>
  <rect width="1200" height="480" rx="24" fill="#090D14"/>
  <rect width="1200" height="480" rx="24" fill="url(#grid)"/>
  <path d="M40 407H1160" stroke="#344159"/>
  <g transform="translate(48 38)">
