<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">UX46 — Make it your own</title>
  <desc id="description">A midnight and violet workspace illustration with a paper note inviting you to change something.</desc>
  <defs>
